<svg width="100%" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <style>
      @keyframes waveMove {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-300px); }
      }
      @keyframes fadeInUp {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .wave1 { animation: waveMove 9s linear infinite; }
      .wave2 { animation: waveMove 13s linear infinite reverse; opacity: 0.35; }
      .title { opacity: 0; animation: fadeInUp 1.1s ease-out 0.2s forwards; }
      .subtitle { opacity: 0; animation: fadeInUp 1.1s ease-out 0.6s forwards; }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>

  <g class="wave1">
    <path d="M0,150 C150,190 300,110 450,150 C600,190 750,110 900,150 C1050,190 1200,110 1350,150 C1500,190 1500,150 1500,150 L1500,200 L0,200 Z" fill="#ffffff" opacity="0.12"/>
  </g>
  <g class="wave2">
    <path d="M0,170 C150,200 300,140 450,170 C600,200 750,140 900,170 C1050,200 1200,140 1350,170 C1500,200 1500,170 1500,170 L1500,200 L0,200 Z" fill="#ffffff" opacity="0.18"/>
  </g>

  <text x="600" y="95" text-anchor="middle" class="title" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Gaurav Kale</text>
  <text x="600" y="128" text-anchor="middle" class="subtitle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#d0f5ea">AI &amp; Data Science | Data Analyst</text>
</svg>
